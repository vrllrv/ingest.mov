name: Deploy to Cloudflare

# Pushing to main did not previously reach production: the only workflow that
# deployed was refresh-festmap, on its weekly cron or a manual dispatch. So a
# fest-map edit could sit on main for days. This closes that gap.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Share refresh-festmap's group so a push-deploy and a scheduled refresh can
# never publish over each other.
concurrency:
  group: refresh-festmap
  cancel-in-progress: false

permissions:
  contents: read # this workflow only publishes; refresh-festmap owns the commits

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run test:ingest

      # Not optional. public/fest-map/meta.json is gitignored but IS deployed,
      # and wrangler's asset manifest is authoritative — deploying without
      # regenerating it would delete it from production, 404ing the map's
      # freshness readout and wedging the Refresh button's polling loop.
      - name: Ingest (regenerates data + meta.json)
        run: npm run ingest

      # Keyword panel festival counts against the catalogue just ingested (no API calls).
      - name: Keyword panel counts
        run: npm run keywords -- --build-only

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # Deliberately no commit step: refresh-festmap is the only workflow that
      # writes data back, and its commits carry [skip ci] so they cannot bounce
      # back into this one.
