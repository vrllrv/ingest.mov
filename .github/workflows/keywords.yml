name: Collect keyword volume

# Keywordtool.io search volume for the keyword panel (/fest-map/keypanel/).
# Daily, but the API is only called when a job is due (never measured, older than
# 28 days, or seeds.json added keywords), and the shared quota is never taken below
# the floor in ingest/keywords/seeds.json — the web app and MCP sessions keep theirs.
on:
  schedule:
    - cron: '0 9 * * *' # daily 09:00 UTC
  workflow_dispatch:
    inputs:
      budget:
        description: 'Max Keywordtool requests this run'
        required: false
        default: '20'

# Same group as refresh-festmap and deploy, so no two runs publish or push at once.
concurrency:
  group: refresh-festmap
  cancel-in-progress: false

permissions:
  contents: write # commits ingest/keywords.json + the panel data

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run test:ingest

      # Allowed to fail so requests already spent still get committed below; the last
      # step fails the job afterwards. Exit 2 = the quota couldn't be read (nothing spent).
      - name: Collect due keyword jobs
        id: collect
        continue-on-error: true
        env:
          KEYWORDTOOL_API_KEY: ${{ secrets.KEYWORDTOOL_API_KEY }}
          BUDGET: ${{ inputs.budget || '20' }}
        run: npm run keywords -- --budget "$BUDGET"

      - name: Anything collected?
        id: changed
        run: |
          if git diff --quiet -- ingest/keywords.json; then
            echo "new=false" >> "$GITHUB_OUTPUT"; echo "No new keyword data."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      # Commit before the ingest: a source being down must not lose paid-for requests.
      - name: Commit keyword data
        if: steps.changed.outputs.new == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ingest/keywords.json public/fest-map/keypanel/data.json
          git commit -m "chore: refresh keyword panel data [skip ci]"
          git pull --rebase origin main
          git push

      # Not optional before a deploy: public/fest-map/meta.json is gitignored but
      # deployed (see deploy.yml), so it has to be regenerated.
      - name: Ingest (regenerates data + meta.json)
        if: steps.changed.outputs.new == 'true'
        run: npm run ingest

      - name: Panel counts against the fresh catalogue
        if: steps.changed.outputs.new == 'true'
        run: npm run keywords -- --build-only

      - name: Deploy to Cloudflare
        if: steps.changed.outputs.new == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Fail if the collector failed
        if: steps.collect.outcome == 'failure'
        run: |
          echo "The keyword collector failed — see its step log. Exit 2 means the quota response wasn't understood."
          exit 1
